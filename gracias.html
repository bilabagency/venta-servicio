    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-card: #161517;
            --gold: #DFD6B5;
            --violet: #5241B0;
            --magenta: #BC65DE;
            --cream: #FDFAF0;
            --font-title: 'Quicksand', sans-serif;
            --font-body: 'Archivo', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--cream);
            font-family: var(--font-body);
            overflow: hidden; /* Evita scroll en la página de gracias */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        #tech-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.5;
            pointer-events: none;
        }

        /* --- CONTENEDOR CENTRAL --- */
        .thank-you-wrapper {
            width: 90%;
            max-width: 600px;
            text-align: center;
            z-index: 10;
            padding: 40px;
            
            /* Efecto Glassmorphism */
            background: rgba(22, 21, 23, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);

            /* Animación de entrada */
            animation: slideUpFade 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        .logo img {
            height: 50px;
            margin-bottom: 30px;
        }

        /* --- ICONO ANIMADO --- */
        .success-icon {
            font-size: 4rem;
            color: var(--gold);
            margin-bottom: 25px;
            display: inline-block;
            filter: drop-shadow(0 0 15px rgba(223, 214, 181, 0.4));
            animation: pulse-gold 2s infinite;
        }

        @keyframes pulse-gold {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(223, 214, 181, 0.4)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 25px rgba(223, 214, 181, 0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(223, 214, 181, 0.4)); }
        }

        /* --- TEXTOS --- */
        h1 {
            font-family: var(--font-title);
            font-size: 2.2rem;
            line-height: 1.2;
            margin-bottom: 20px;
            background: linear-gradient(180deg, #FFF 30%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: rgba(253, 250, 240, 0.8);
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 300;
        }

        /* --- LINKS SOCIALES --- */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
        }

        @media (min-width: 600px) {
            .social-links { flex-direction: row; }
        }

        .btn-social {
            padding: 16px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-family: var(--font-title);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        /* Botón Instagram (Estilo Llamativo) */
        .btn-insta {
            background: linear-gradient(45deg, var(--violet), var(--magenta));
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 20px rgba(188, 101, 222, 0.3);
        }
        .btn-insta:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(188, 101, 222, 0.6);
            color: #fff;
        }

        /* Botón Web (Estilo Minimalista) */
        .btn-web {
            background: rgba(255, 255, 255, 0.05);
            color: var(--cream);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-web:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--gold);
            color: var(--gold);
        }

        footer {
            margin-top: 30px;
            font-size: 0.75rem;
            opacity: 0.3;
        }

    </style>

    <script>
        const canvas = document.getElementById('tech-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resize() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.3; // Velocidad ligeramente más lenta para "chill vibes"
                this.vy = (Math.random() - 0.5) * 0.3;
            }
            update() {
                this.x += this.vx; 
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
        }
        
        // Reduje un poco la cantidad de partículas para que sea más limpio
        for(let i=0; i<70; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(188, 101, 222, 0.2)'; // Color Magenta suave
            ctx.lineWidth = 1;
            
            particles.forEach((p, i) => {
                p.update();
                for(let j=i+1; j<particles.length; j++) {
                    let d = Math.hypot(p.x - particles[j].x, p.y - particles[j].y);
                    if(d < 150) {
                        ctx.beginPath(); 
                        ctx.moveTo(p.x, p.y); 
                        ctx.lineTo(particles[j].x, particles[j].y); 
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
